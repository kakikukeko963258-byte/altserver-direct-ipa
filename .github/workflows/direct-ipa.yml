name: Build Direct IPA Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: .vcpkg
      - name: Bootstrap vcpkg
        shell: pwsh
        run: ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Build and package modified AltServer
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
          VCPKG_DISABLE_METRICS: '1'
        run: ./AltServer-Windows/Scripts/build-release.ps1 -OutputDirectory "$env:RUNNER_TEMP/Artifacts"
      - name: Test direct bridge
        shell: pwsh
        run: ./AltServer-Windows/Scripts/test-direct-ipa.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AltServer-Direct-IPA-Windows
          path: ${{ runner.temp }}/Artifacts/AltForge-AltServer-Windows.zip
          if-no-files-found: error
          retention-days: 14
