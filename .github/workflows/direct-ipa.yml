name: Build Direct IPA Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v6
      - name: Prepare dependency cache
        id: toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products * -property installationPath | Select-Object -First 1
          $versions = (Get-ChildItem (Join-Path $vs 'VC/Tools/MSVC') -Directory | Sort-Object Name | ForEach-Object Name) -join '-'
          if (-not $versions) { throw 'C++ toolchain version missing' }
          $compiler = Get-ChildItem (Join-Path $vs 'VC/Tools/MSVC/*/bin/Hostx64/x86/cl.exe') | Sort-Object FullName | Select-Object -Last 1
          if (-not $compiler) { throw 'C++ compiler missing' }
          $compilerVersion = $compiler.VersionInfo.FileVersion -replace '\s',''
          $sdk = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/Include' -Directory | Sort-Object Name | Select-Object -Last 1 -ExpandProperty Name
          "version=$versions-$compilerVersion-$sdk-$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-x86-v3-${{ steps.toolchain.outputs.version }}-${{ hashFiles('AltServer-Windows/vcpkg.json') }}
          restore-keys: |
            native-x86-v3-${{ steps.toolchain.outputs.version }}-
            native-x86-v2-
            native-x86-v1-
      - uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: .vcpkg
      - name: Bootstrap vcpkg
        shell: pwsh
        run: ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Build and package modified AltServer
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
          VCPKG_DISABLE_METRICS: '1'
        run: ./AltServer-Windows/Scripts/build-release.ps1 -OutputDirectory "$env:RUNNER_TEMP/Artifacts"
      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-x86-v3-${{ steps.toolchain.outputs.version }}-${{ hashFiles('AltServer-Windows/vcpkg.json') }}
      - name: Test direct bridge
        shell: pwsh
        run: ./AltServer-Windows/Scripts/test-direct-ipa.ps1
      - name: Test actual ZIP extraction
        shell: pwsh
        run: ./AltServer-Windows/Scripts/test-archive.ps1
      - name: Test menu setup and rollback
        shell: pwsh
        run: ./AltServer-Windows/Scripts/test-direct-menu.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AltServer-Direct-IPA-Windows
          path: ${{ runner.temp }}/Artifacts/AltForge-AltServer-Windows.zip
          if-no-files-found: error
          retention-days: 14
